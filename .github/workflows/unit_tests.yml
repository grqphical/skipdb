name: Tests

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y cmake ninja-build build-essential

      - name: Cache gtest
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-gtest-v1.15.2

      - name: Configure CMake
        run: >
          cmake -B build
          -G Ninja
          -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Run tests
        working-directory: build
        run: ./skipdb_tests
